kicker: About
title: The Saga of Jón
lede: Developer, saga enthusiast, professional dragon-botherer. The long version, plus a letter you can forward to your hiring manager.
sections:
  body:
    - <span class="drop">I</span> grew up in Reykjavík on a steady diet of Norse myth and Nintendo cartridges, which explains almost everything that follows. By day I'm a full-stack developer — ten years of building APIs, frontends, and the unglamorous plumbing in between. By night I am, depending on the hour, a Tarnished, a Shinobi, or a Hunter.
    - "I gravitate toward the trickster gods — Loki, Hermes — not for the chaos, but for the lateral thinking. The best engineering I've done has been Loki-shaped: the sideways solution nobody asked for that quietly becomes the way things are done. My favorite hero is Odysseus for the same reason. Strength is fine; <em>cleverness gets you home.</em>"
    - I'm an INFJ, which in practice means I'll be quiet in your stand-up and then send you a four-paragraph document about the thing nobody mentioned. I do my best thinking with a cup of masala chai — extra cardamom — and my best debugging at 1 a.m. with a cat on the keyboard, which is also how most of my typos happen.
    - "Things I believe: software should outlive its author's enthusiasm. Error messages are user interface. Every codebase is a saga — it deserves a narrator who cares. And somewhere in every hard problem there is a hidden wall you can roll through."
