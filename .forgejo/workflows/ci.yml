name: CI
on:
  push:
    branches: [main, preview]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (via corepack, pinned by packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Unit + render tests
        run: pnpm test

  dotnet:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build jonnxor.sln --configuration Release
      - name: Test
        run: dotnet test jonnxor.sln --configuration Release --no-build

  e2e-visual:
    # heavier browser suite — only where it gates a deploy; don't bother if units fail
    needs: build-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm (via corepack, pinned by packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: E2E
        run: pnpm exec playwright test ../tests/e2e
      - name: Visual regression
        run: pnpm exec playwright test ../tests/visual
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
